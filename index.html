<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DocScan</title>
  <meta name="description" content="Scan documents to PDF on your phone. Everything stays on the device.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DocScan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Home -->
  <section id="view-home" class="view" hidden>
    <header class="home-bar">
      <div class="brand">
        <img src="icons/favicon.svg" alt="" width="28" height="28">
        <span>DocScan</span>
        <span class="app-version" hidden></span>
      </div>
      <button type="button" class="status" hidden></button>
      <button type="button" class="text-btn" data-act="new" hidden>New scan</button>
    </header>

    <main class="home-main">
      <div class="resume" hidden>
        <span class="resume-text"></span>
        <button type="button" class="icon-btn sm" data-act="dismiss" data-icon="close" aria-label="Dismiss"></button>
      </div>

      <div class="doc-head" hidden>
        <input class="doc-name" aria-label="Document name" autocomplete="off" enterkeyhint="done" spellcheck="false">
        <span class="doc-count"></span>
      </div>

      <div class="grid" hidden></div>

      <div class="empty">
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 120 120"><rect x="26" y="14" width="68" height="88" rx="6" class="ea-page"/><path d="M40 36h40M40 48h40M40 60h28" class="ea-lines"/><path d="M14 30V14h16M106 30V14H90M14 90v16h16M106 90v16H90" class="ea-frame"/></svg>
        </div>
        <h1>Scan a document</h1>
        <p>Take a photo of each page. The edges are found and straightened, and the pages go out as one PDF or as images.</p>
        <div class="empty-actions">
          <button type="button" class="btn primary big" data-act="camera" data-icon="camera"><span>Take photo</span></button>
          <button type="button" class="btn big" data-act="gallery" data-icon="images"><span>Import photos</span></button>
        </div>
        <p class="privacy" data-icon="lock"><span>Photos stay on this device. Nothing is uploaded.</span></p>
      </div>
    </main>

    <nav class="dock">
      <button type="button" class="dock-btn" data-act="gallery" data-icon="images"><span>Import</span></button>
      <button type="button" class="shutter" data-act="camera" aria-label="Take photo" data-icon="camera"></button>
      <button type="button" class="dock-btn" data-act="pdf" data-icon="share" disabled><span>Export</span></button>
    </nav>
  </section>

  <!-- Crop -->
  <section id="view-crop" class="view dark" hidden>
    <header class="bar">
      <button type="button" class="icon-btn" data-act="back" data-icon="back" aria-label="Back"></button>
      <h2>Adjust edges</h2>
      <span class="bar-spacer"></span>
    </header>
    <div class="crop-stage">
      <img alt="" draggable="false">
      <svg class="crop-svg" aria-hidden="true"></svg>
      <canvas class="loupe" aria-hidden="true"></canvas>
      <span class="crop-status pill" hidden></span>
    </div>
    <p class="crop-hint">Drag a corner or an edge to line it up with the paper.</p>
    <footer class="toolbar">
      <button type="button" class="tool" data-act="auto" data-icon="auto"><span>Auto</span></button>
      <button type="button" class="tool" data-act="full" data-icon="full"><span>Whole photo</span></button>
      <button type="button" class="btn primary next" data-act="next"><span>Next</span></button>
    </footer>
  </section>

  <!-- Page: filter and rotate -->
  <section id="view-page" class="view dark" hidden>
    <header class="bar">
      <button type="button" class="icon-btn" data-act="back" data-icon="back" aria-label="Back"></button>
      <h2 class="page-title">Page</h2>
      <button type="button" class="icon-btn" data-act="delete" data-icon="trash" aria-label="Delete page"></button>
    </header>
    <div class="page-stage">
      <canvas></canvas>
      <div class="spin-wrap"><span class="spin"></span></div>
    </div>
    <div class="page-tools">
      <button type="button" class="tool" data-act="crop" data-icon="crop"><span>Crop</span></button>
      <button type="button" class="tool" data-act="rotl" data-icon="rotL"><span>Left</span></button>
      <button type="button" class="tool" data-act="rotr" data-icon="rotR"><span>Right</span></button>
      <button type="button" class="tool" data-act="all" data-icon="check"><span>Use on all</span></button>
    </div>
    <div class="chips"></div>
    <footer class="toolbar">
      <button type="button" class="btn ghost" data-act="add" data-icon="plus"><span>Next page</span></button>
      <button type="button" class="btn primary next" data-act="done"><span>Done</span></button>
    </footer>
  </section>

  <div id="busy" class="busy" hidden>
    <div class="busy-card"><span class="spin"></span><span class="busy-msg"></span></div>
  </div>

  <input id="in-camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="in-gallery" type="file" accept="image/*" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
